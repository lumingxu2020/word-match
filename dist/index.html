  function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
  function startGame({level}={}){if(level){currentLevel=level;$('#mode').value='challenge';$('#unit').value=levelUnits[level-1]}const unit=$('#unit').value,cat=$('#category').value,count=Number($('#pairCount').value);let pool=words.filter(w=>(unit==='全部单元'||w.unit===unit)&&(cat==='全部分类'||w.category===cat));if(pool.length<2){toast('这个组合的词语太少啦');return}gameWords=shuffle(pool).slice(0,Math.min(count,pool.length));const cards=shuffle(gameWords.flatMap(w=>[{...w,text:w.en,side:'EN',lang:'en-US'},{...w,text:w.zh,side:'中文',lang:'zh-CN'}]));matched=0;score=0;selected=null;$('#score').textContent=0;$('#progressBar').style.width='0';$('#missionTitle').textContent=$('#mode').value==='challenge'?`第 ${currentLevel} 关 · ${unit}`:`${unit} · ${cat}`;$('#board').innerHTML=cards.map((c,i)=>`<button class="card" data-id="${c.id}" data-index="${i}" data-type="${c.side}" data-lang="${c.lang}">${c.text}</button>`).join('');$$('.card').forEach(c=>c.onclick=()=>pick(c));show('play')}
  function pick(card){if(card===selected||card.classList.contains('matched'))return;speak(card.text,card.dataset.lang);card.classList.add('selected');if(!selected){selected=card;return}if(selected.dataset.id===card.dataset.id){selected.classList.add('matched');card.classList.add('matched');selected.classList.remove('selected');card.classList.remove('selected');matched++;score+=100;$('#score').textContent=score;$('#progressBar').style.width=`${matched/gameWords.length*100}%`;selected=null;if(matched===gameWords.length)setTimeout(win,500)}else{const first=selected;first.classList.add('wrong');card.classList.add('wrong');score=Math.max(0,score-10);$('#score').textContent=score;selected=null;setTimeout(()=>{first.classList.remove('selected','wrong');card.classList.remove('selected','wrong')},430)}}
  function win(){speak('任务完成','zh-CN');toast('任务完成！获得三颗星 ★★★');const best=Number(localStorage.getItem('wordSquadBest')||0);if(score>best)localStorage.setItem('wordSquadBest',score);if($('#mode').value==='challenge'){progress[currentLevel]=Math.max(progress[currentLevel]||0,score);save()}renderHome()}
  function renderHome(){const done=Object.keys(progress).length;$('#wordCount').textContent=words.length;$('#bestScore').textContent=localStorage.getItem('wordSquadBest')||0;$('#cleared').textContent=`${done}/8`;$('#levelMap').innerHTML=levelUnits.map((u,i)=>`<button class="level ${progress[i+1]?'done':''}" data-level="${i+1}"><span class="level-num">${progress[i+1]?'✓':i+1}</span><span><h4>${u}</h4><p>${words.filter(w=>w.unit===u).length} 个词 · ${i<6?'课本单元':'拓展任务'}</p></span><span class="stars">${progress[i+1]?'★★★':'→'}</span></button>`).join('');$$('.level').forEach(b=>b.onclick=()=>startGame({level:Number(b.dataset.level)}))}
  function renderLibrary(){const q=words;$('#libraryCount').textContent=q.length;$('#wordTable').innerHTML=q.map(w=>`<div class="word-row"><div><strong>${w.en}</strong><small style="display:block;color:var(--muted)">${w.unit}</small></div><div>${w.zh}</div><button aria-label="删除 ${w.en}" data-del="${w.id}">×</button></div>`).join('');$$('[data-del]').forEach(b=>b.onclick=()=>{words=words.filter(w=>w.id!==b.dataset.del);save();options();renderLibrary();renderHome()})}
  function show(id){$$('.screen').forEach(x=>x.classList.toggle('active',x.id===id));$$('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.screen===id));if(id==='library')renderLibrary();window.scrollTo({top:0,behavior:'smooth'})}
  $$('.nav-btn').forEach(b=>b.onclick=()=>show(b.dataset.screen));$('#quickStart').onclick=()=>startGame();$('#newGame').onclick=()=>startGame();$('#unit').onchange=()=>{};$('#category').onchange=()=>{};
  $('#soundToggle').onclick=()=>{soundOn=!soundOn;$('#soundToggle').textContent=soundOn?'🔊 语音':'🔇 静音';toast(soundOn?'语音已打开':'语音已关闭')};
  $$('.theme-card').forEach(b=>b.onclick=()=>{document.body.dataset.theme=b.dataset.themeChoice;localStorage.setItem('wordSquadTheme',b.dataset.themeChoice);$$('.theme-card').forEach(x=>x.classList.toggle('active',x===b));toast('主题已切换')});
  const savedTheme=localStorage.getItem('wordSquadTheme')||'tactical';document.body.dataset.theme=savedTheme;$$('.theme-card').forEach(x=>x.classList.toggle('active',x.dataset.themeChoice===savedTheme));
  $('#manualImport').onclick=()=>$('#importDialog').showModal();$('#confirmImport').onclick=()=>{const lines=$('#importText').value.split(/\n/).map(x=>x.trim()).filter(Boolean);let added=0;for(const line of lines){const p=line.split(/\s*[=,，\t]\s*/);if(p.length>=2){words.push({id:'custom-'+Date.now()+'-'+added,en:p[0],zh:p.slice(1).join('，'),unit:$('#importUnit').value,category:'自定义'});added++}}if(added){save();options();renderLibrary();renderHome();$('#importDialog').close();$('#importText').value='';toast(`已导入 ${added} 个词`)}else toast('请按示例填写词语')};
  $('#imageInput').onchange=async e=>{const files=[...e.target.files];if(!files.length)return;toast(`已读取 ${files.length} 张图片`);if('TextDetector' in window){try{const detector=new TextDetector();let all='';for(const f of files){const bmp=await createImageBitmap(f);const blocks=await detector.detect(bmp);all+=blocks.map(b=>b.rawValue).join('\n')+'\n'}$('#importText').value=all;$('#importDialog').showModal();toast('已识别文字，请核对配对')}catch{ $('#importDialog').showModal() }}else{$('#importDialog').showModal();toast('请把识别后的词语粘贴到输入框')}};
  $('#resetLibrary').onclick=()=>{if(confirm('恢复课本词库会删除后来添加的词，确定吗？')){words=seed;save();options();renderLibrary();renderHome();toast('已恢复课本词库')}};
  options();renderHome();startGame();show('home');
  </script>
</body>
